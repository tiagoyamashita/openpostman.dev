    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",

          },
          {
            "@type": "WebApplication",
            "@id": "https://openpostman.dev/#app",
            "name": "OpenPostman",
            "alternateName": ["openpostman.dev", "OpenPutMan"],
            "url": "https://openpostman.dev/",
            "image": "https://openpostman.dev/logo.png",
            "description": "Free, open-source API client. Import OpenAPI or Swagger to read an API, send HTTP requests to test it, and share collections over GitHub Gists.",

            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "license": "https://github.com/tiagoyamashita/openpostman.dev/blob/main/LICENSE",
            "codeRepository": "https://github.com/tiagoyamashita/openpostman.dev",
            "isAccessibleForFree": true
          },
          {
            "@type": "FAQPage",
            "@id": "https://openpostman.dev/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is OpenPostman free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. OpenPostman is a free, Apache 2.0–licensed open-source project. There is no paid tier and no seat limit."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need an account to test APIs?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. You can read specs and send requests as a guest. Collections stay in this browser's local storage until you choose to sign in."
                }
              },
              {
                "@type": "Question",
                "name": "How do I share an API collection with my team?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sign in with GitHub and OpenPostman saves the workspace to a private Gist you own. Share that Gist, or export JSON, so everyone tests the same library."
                }
              },
              {
                "@type": "Question",
                "name": "Is OpenPostman a Postman alternative?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "OpenPostman is a free, open-source API client in the browser. Import OpenAPI 3.x or Swagger 2.0, send real HTTP requests, and keep collections on GitHub instead of a vendor database."
                }
              }
            ]
          }
        ]
      }
